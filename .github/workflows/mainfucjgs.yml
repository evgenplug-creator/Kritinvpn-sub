name: Update VPN Keys Every Minute

# Права на запись в репозиторий
permissions:
  contents: write

on:
  schedule:
    # Запускать каждую минуту
    - cron: '* * * * *'
  # Ручной запуск
  workflow_dispatch:

jobs:
  update-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process and Rename Keys
        run: |
          echo "📥 Начинаю сбор и обработку ключей..."
          
          # 1. Заголовок подписки и описание (KritinVPN🔥)
          echo "# profile-title: KritinVPN🔥" > sub.txt
          echo "# profile-update-interval: 1" >> sub.txt
          echo "" >> sub.txt
          
          # Текстовое описание в виде фейковых узлов
          echo "vless://00000000-0000-0000-0000-000000000001@127.0.0.1:443#📢 TG: @kritinvpn_bot" >> sub.txt
          echo "vless://00000000-0000-0000-0000-000000000002@127.0.0.1:443#⚠️ Сервера с отметкой VPN не работают при белых списках." >> sub.txt
          echo "vless://00000000-0000-0000-0000-000000000003@127.0.0.1:443#🚀 Используйте рабочие LTE для обхода глушилок" >> sub.txt
          echo "" >> sub.txt

          # Массив имен для русских ключей
          RU_NAMES=("Игровой" "Запасной" "Обход" "Все операторы" "TELE2" "Мобильный")
          RU_INDEX=0
          RU_FOUND_COUNT=0

          # --- ИСТОЧНИК 1: Hidashimora (10 случайных, VPN | Страна) ---
          curl -L -s "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt" | \
          grep -v -i "anycast" | grep -v '^#' | grep -v '^$' | shuf -n 10 > src1.txt
          
          while read -r line; do
            base_link=$(echo "$line" | cut -d'#' -f1)
            country=$(echo "$line" | cut -d'#' -f2 | sed 's/%20/ /g')
            echo "${base_link}#VPN | ${country}" >> sub.txt
          done < src1.txt

          # --- ИСТОЧНИК 2: igareck ALL (LTE | Название) ---
          curl -L -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" | \
          grep -v '^#' | grep -v '^$' > src2.txt
          
          while read -r line; do
            base_link=$(echo "$line" | cut -d'#' -f1)
            old_name=$(echo "$line" | cut -d'#' -f2 | sed 's/%20/ /g')
            
            if echo "$old_name" | grep -qiE "RU|Russia|Россия"; then
              name_idx=$((RU_INDEX % ${#RU_NAMES[@]}))
              echo "${base_link}#LTE | ${RU_NAMES[$name_idx]}" >> sub.txt
              ((RU_INDEX++))
              ((RU_FOUND_COUNT++))
            else
              echo "${base_link}#LTE | ${old_name}" >> sub.txt
            fi
          done < src2.txt

          # --- ИСТОЧНИК 3: Добор RU ключей (если < 5) ---
          if [ $RU_FOUND_COUNT -lt 5 ]; then
            curl -L -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" | \
            grep -v '^#' | grep -v '^$' | head -n 5 > src3.txt
            
            while read -r line; do
              base_link=$(echo "$line" | cut -d'#' -f1)
              name_idx=$((RU_INDEX % ${#RU_NAMES[@]}))
              echo "${base_link}#LTE | ${RU_NAMES[$name_idx]}" >> sub.txt
              ((RU_INDEX++))
              ((RU_FOUND_COUNT++))
              [ $RU_FOUND_COUNT -ge 8 ] && break
            done < src3.txt
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "🔄 Обновление ключей: $(date '+%d.%m.%Y %H:%M:%S')" || exit 0
          git push
