name: Update VPN Keys Every Minute

permissions:
  contents: write

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Process Keys
        run: |
          # 1. Заголовки и описание
          echo -e "# profile-title: KritinVPN🔥\n# profile-update-interval: 1\n" > sub.txt
          echo "vless://00000001@127.0.0.1:443#📢 TG: @kritinvpn_bot" >> sub.txt
          echo "vless://00000002@127.0.0.1:443#⚠️ Сервера с отметкой VPN не работают при белых списках." >> sub.txt
          echo "vless://00000003@127.0.0.1:443#🚀 Используйте рабочие LTE для обхода глушилок\n" >> sub.txt

          RUNAMES=("Игровой" "Запасной" "Обход" "Все операторы" "TELE2" "Мобильный")
          RI=0; RC=0

          # 2. Источник 1 (10 ключей VPN)
          curl -Ls "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt" | grep -vi anycast | grep -vE '^#|^$' | shuf -n 10 | while read -r l; do
            echo "$(echo $l | cut -d# -f1)#VPN | $(echo $l | cut -d# -f2 | sed 's/%20/ /g')" >> sub.txt
          done

          # 3. Источник 2 (LTE ключи)
          curl -Ls "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" | grep -vE '^#|^$' | while read -r l; do
            link=$(echo $l | cut -d# -f1); name=$(echo $l | cut -d# -f2 | sed 's/%20/ /g')
            if echo "$name" | grep -qiE "RU|Russia|Россия"; then
              echo "$link#LTE | ${RUNAMES[$((RI % 6))]}" >> sub.txt; ((RI++)); ((RC++))
            else
              echo "$link#LTE | $name" >> sub.txt
            fi
          done

          # 4. Резерв (если RU < 5)
          if [ $RC -lt 5 ]; then
            curl -Ls "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" | grep -vE '^#|^$' | head -n 8 | while read -r l; do
              echo "$(echo $l | cut -d# -f1)#LTE | ${RUNAMES[$((RI % 6))]}" >> sub.txt; ((RI++))
            done
          fi

      - name: Push
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@mail.com"
          git add sub.txt
          git commit -m "update" || exit 0
          git push
          
