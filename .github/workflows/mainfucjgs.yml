name: Update VPN Keys (3 источника)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-vpn-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process all sources
        run: |
          echo "📥 1. Источник 1 (Hidashimora) — 10 любых ключей, название 'VPN | Страна'"
          curl -L -o src1.txt "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt"
          grep -v '^#' src1.txt | grep -v '^$' | grep -v -i "anycast" > src1_clean.txt
          shuf src1_clean.txt | head -n 10 > src1_selected.txt
          echo "   Выбрано $(wc -l < src1_selected.txt) ключей"

          echo "📥 2. Источник 2 (igareck WHITE-SNI-RU) — все ключи, LTE | Страна (русские — по списку)"
          curl -L -o src2.txt "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt"
          grep -v '^#' src2.txt | grep -v '^$' > src2_clean.txt
          echo "   Скачано $(wc -l < src2_clean.txt) ключей"

          echo "📥 3. Источник 3 (igareck Vless-Reality-White-Lists-Rus-Mobile) — 5-6 русских ключей, LTE | Страна"
          curl -L -o src3.txt "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
          grep -v '^#' src3.txt | grep -v '^$' > src3_all.txt
          
          # Отбираем только ключи с меткой Russia и выбираем 5-6 случайных
          grep -i "russia" src3_all.txt > src3_ru.txt
          ru_count=$(wc -l < src3_ru.txt)
          if [ $ru_count -gt 0 ]; then
            # Случайное число от 5 до 6
            RANDOM_COUNT=$(( RANDOM % 2 + 5 ))
            shuf src3_ru.txt | head -n $RANDOM_COUNT > src3_selected.txt
            echo "   Выбрано $(wc -l < src3_selected.txt) русских ключей из $ru_count доступных"
          else
            echo "   ⚠️ Русских ключей не найдено"
            touch src3_selected.txt
          fi

          echo "🔄 Создаю sub.txt с правильными именами..."

          # === ЗАГОЛОВКИ ДЛЯ HAPP ===
          echo "#profile-title: 🏳️KritinVPN" > sub.txt
          echo "#profile-update-interval: 1" >> sub.txt
          echo "# Обновлено: $(date '+%d.%m.%Y %H:%M:%S')" >> sub.txt
          echo "" >> sub.txt
          echo "# ===== 1. VPN (Hidashimora) — 10 шт =====" >> sub.txt

          # --- 1. Источник: добавляем "VPN | " перед комментарием ---
          while IFS= read -r line; do
            if [[ "$line" == *"#"* ]]; then
              key_part="${line%#*}"
              old_comment="${line#*#}"
              echo "${key_part}#VPN | ${old_comment}" >> sub.txt
            else
              echo "$line" >> sub.txt
            fi
          done < src1_selected.txt

          echo "" >> sub.txt
          echo "# ===== 2. LTE (WHITE-SNI-RU) =====" >> sub.txt

          # --- 2. Источник: LTE | ... , русские — по списку ---
          RU_NAMES=("LTE | Игровой" "LTE | Запасной" "LTE | Обход" "LTE | Все операторы" "LTE | TELE2")
          ru_counter=0

          while IFS= read -r line; do
            if [[ "$line" == *"#"* ]]; then
              key_part="${line%#*}"
              old_comment="${line#*#}"
              
              if echo "$old_comment" | grep -qi "russia\|россия"; then
                # Русский ключ — выбираем имя из списка по очереди
                new_name="${RU_NAMES[$ru_counter]}"
                ru_counter=$(( (ru_counter + 1) % ${#RU_NAMES[@]} ))
                echo "${key_part}#${new_name} ${old_comment}" >> sub.txt
              else
                # Нерусский — просто LTE |
                echo "${key_part}#LTE | ${old_comment}" >> sub.txt
              fi
            else
              echo "$line" >> sub.txt
            fi
          done < src2_clean.txt

          echo "" >> sub.txt
          echo "# ===== 3. LTE Mobile (только русские, 5-6 шт) =====" >> sub.txt

          # --- 3. Источник: только русские ключи, название "LTE | Страна" ---
          while IFS= read -r line; do
            if [[ "$line" == *"#"* ]]; then
              key_part="${line%#*}"
              old_comment="${line#*#}"
              # Уже отфильтровано только Russia, но на всякий случай проверим
              echo "${key_part}#LTE | ${old_comment}" >> sub.txt
            else
              echo "$line" >> sub.txt
            fi
          done < src3_selected.txt

          echo "✅ Готово! Файл sub.txt создан с заголовками для Happ"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "🔄 Обновление 3 источников $(date '+%d.%m.%Y %H:%M:%S')" || echo "Нет изменений"
          git push
          echo "✅ Отправлено в репозиторий"
