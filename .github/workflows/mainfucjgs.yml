name: Update VPN Keys (Hidashimora + Igareck)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-vpn-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process keys
        run: |
          echo "📥 1. Скачиваю ключи из источника 1 (Hidashimora)..."
          curl -L -o source1.txt "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt"
          
          # Чистим и исключаем Anycast
          grep -v '^#' source1.txt | grep -v '^$' | grep -v -i "anycast" > source1_clean.txt
          
          # Берём 10 случайных ключей
          shuf source1_clean.txt | head -n 10 > source1_selected.txt
          
          echo "📥 2. Скачиваю ключи из источника 2 (igareck)..."
          curl -L -o source2.txt "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt"
          
          # Убираем только строки-заголовки (которые начинаются с # в начале строки)
          grep -v '^#' source2.txt | grep -v '^$' > source2_clean.txt
          
          echo "🔄 Создаю sub.txt..."
          
          # Заголовок
          echo "# KritinVPN - Обновлено $(date '+%d.%m.%Y %H:%M:%S')" > sub.txt
          echo "" >> sub.txt
          echo "# ===== КЛЮЧИ VPN (10 шт) =====" >> sub.txt
          
          # Список имён для российских LTE
          RU_NAMES=("LTE | Игровой" "LTE | Запасной" "LTE | Обход" "LTE | Все операторы" "LTE | TELE2")
          ru_counter=0
          
          # Обрабатываем ключи из источника 1 (Hidashimora)
          # Просто добавляем "VPN | " перед существующим комментарием
          while IFS= read -r line; do
              if [[ "$line" == *"#"* ]]; then
                  # Разделяем ключ и комментарий
                  key_part="${line%#*}"
                  old_comment="${line#*#}"
                  # Добавляем VPN | перед комментарием
                  echo "${key_part}#VPN | ${old_comment}" >> sub.txt
              else
                  echo "$line" >> sub.txt
              fi
          done < source1_selected.txt
          
          echo "" >> sub.txt
          echo "# ===== КЛЮЧИ LTE =====" >> sub.txt
          
          # Обрабатываем ключи из источника 2 (Igareck)
          while IFS= read -r line; do
              if [[ "$line" == *"#"* ]]; then
                  key_part="${line%#*}"
                  old_comment="${line#*#}"
                  
                  # Проверяем, российский ли ключ (по наличию Russia или флага России)
                  if echo "$old_comment" | grep -qi "russia\|россия\|%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D1%8F"; then
                      # Берём следующее имя из списка
                      new_name="${RU_NAMES[$ru_counter]}"
                      ru_counter=$((ru_counter + 1))
                      if [ $ru_counter -ge ${#RU_NAMES[@]} ]; then
                          ru_counter=0
                      fi
                      echo "${key_part}#${new_name} ${old_comment}" >> sub.txt
                  else
                      # Нерусский - добавляем LTE | перед комментарием
                      echo "${key_part}#LTE | ${old_comment}" >> sub.txt
                  fi
              else
                  echo "$line" >> sub.txt
              fi
          done < source2_clean.txt
          
          echo "✅ Готово! Создано $(wc -l < sub.txt) строк"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "🔄 Обновление $(date '+%d.%m.%Y %H:%M:%S')" || echo "Нет изменений"
          git push
          echo "✅ Отправлено в репозиторий"
