name: Update VPN Keys (Hidashimora + Igareck)

on:
  schedule:
    # Запуск каждые 30 минут (более стабильно, чем каждую минуту)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Ручной запуск

permissions:
  contents: write

jobs:
  merge-vpn-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process keys
        run: |
          # --- Функция для извлечения страны из комментария (для ключей VPN и нерусских LTE) ---
          extract_country() {
              local comment="$1"
              # Ищем в комментарии флаг страны и идущее за ним название
              # Пример: %F0%9F%87%BA%F0%9F%87%A6%20USA -> USA
              local country=$(echo "$comment" | grep -oP '(%[0-9A-F]{2}){4}\s*\K[A-Za-z\s]+' | head -1 | xargs)
              if [[ -z "$country" ]]; then
                  # Если не нашли по флагу, ищем по ключевым словам 'France', 'Kazakhstan' и т.д.
                  country=$(echo "$comment" | grep -oP '(?<=\%20)[A-Z][a-z]+(?=\%| |$)' | head -1)
              fi
              if [[ -z "$country" ]]; then
                  country="World"
              fi
              echo "$country"
          }

          # --- 1. Обработка источника Hidashimora (10 случайных ключей, VPN | Страна) ---
          echo "📥 1. Скачиваю ключи из источника 1 (Hidashimora)..."
          curl -L -o source1_all.txt "https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/28.1.txt"
          
          # Чистим от пустых строк, комментариев и исключаем Anycast
          grep -v '^#' source1_all.txt | grep -v '^$' | grep -v -i "anycast" > source1_clean.txt
          
          # Случайно выбираем ровно 10 ключей (или меньше, если их всего меньше 10)
          shuf source1_clean.txt | head -n 10 > source1_selected.txt
          
          echo "✅ Выбрано $(wc -l < source1_selected.txt) / 10 ключей из источника 1"

          # --- 2. Обработка источника Igareck (все ключи, LTE | ...) ---
          echo "📥 2. Скачиваю ключи из источника 2 (igareck)..."
          curl -L -o source2_all.txt "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt"
          
          # Убираем строки-заголовки, которые начинаются с '#' в начале файла
          grep -v '^#' source2_all.txt | grep -v '^$' > source2_clean.txt
          echo "✅ Скачано $(wc -l < source2_clean.txt) ключей из источника 2"

          # --- 3. Создание финального sub.txt с новыми именами ---
          echo "🔄 Создаю файл подписки sub.txt с новыми именами..."
          
          # Заголовок для удобства чтения
          echo "# KritinVPN - Объединённая подписка (Обновлено: $(date '+%d.%m.%Y %H:%M:%S'))" > sub.txt
          echo "# ---------- КЛЮЧИ VPN (Источник 1) ----------" >> sub.txt
          
          # Список имен для русских ключей из источника 2
          RU_NAMES=("LTE | Игровой" "LTE | Запасной" "LTE | Обход" "LTE | Все операторы" "LTE | TELE2")
          ru_name_index=0
          
          # Перебираем выбранные ключи из источника 1 (Hidashimora)
          while IFS= read -r line; do
              # Извлекаем страну из комментария
              if [[ "$line" == *"#"* ]]; then
                  comment="${line#*#}"
                  country=$(extract_country "$comment")
              else
                  country="World"
              fi
              # Создаем новое имя: "VPN | Страна"
              new_name="VPN | $country"
              # Формируем строку: base64 имя + ключ
              # Ключ часто приходит с экранированным комментарием, оставляем как есть
              echo "$line#$new_name" >> sub.txt
          done < source1_selected.txt
          
          # Добавляем разделитель
          echo "" >> sub.txt
          echo "# ---------- КЛЮЧИ LTE (Источник 2) ----------" >> sub.txt
          
          # Перебираем все ключи из источника 2 (Igareck)
          while IFS= read -r line; do
              new_name=""
              # Проверяем, является ли ключ русским (по наличию метки Russia или Россия)
              if [[ "$line" == *"Russia"* ]] || [[ "$line" == *"Россия"* ]] || [[ "$line" == *"%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D1%8F"* ]]; then
                  # Берем следующее имя из списка, по кругу, если ключей больше 5
                  current_name="${RU_NAMES[$ru_name_index]}"
                  new_name="$current_name"
                  ru_name_index=$(( (ru_name_index + 1) % ${#RU_NAMES[@]} ))
              else
                  # Иначе — нерусский ключ, извлекаем страну
                  if [[ "$line" == *"#"* ]]; then
                      comment="${line#*#}"
                      country=$(extract_country "$comment")
                  else
                      country="World"
                  fi
                  new_name="LTE | $country"
              fi
              
              # Обрезаем или заменяем существующий комментарий в строке ключа
              # Удаляем старый комментарий (#... в конце строки) и добавляем новый
              clean_key=$(echo "$line" | sed 's/#.*//')
              echo "${clean_key}#${new_name}" >> sub.txt
          done < source2_clean.txt
          
          echo "✅ Файл sub.txt успешно создан!"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "🔄 Автообновление подписки $(date '+%d.%m.%Y %H:%M:%S')" || echo "📊 Нет изменений для коммита"
          git push
          echo "✅ Изменения отправлены в репозиторий"

      - name: Log completion
        if: always()
        run: |
          echo "✅ Workflow успешно завершен в $(date '+%d.%m.%Y %H:%M:%S')"
